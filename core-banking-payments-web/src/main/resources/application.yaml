spring:
  application:
    name: core-baking-payments
    version: 1.0.0
    description: Payments Core Application
    team:
      name: Firefly Software Foundation
      email: dev@fireflysoftware.io

  r2dbc:
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  threads:
    virtual:
      enabled: true

server:
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
  packages-to-scan: io.fireflysoftware.core.banking.payments.web.controllers
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

managed-payments:
  security:
    issuer: ${MANAGED_PAYMENTS_SECURITY_ISSUER:}
    audience: ${MANAGED_PAYMENTS_SECURITY_AUDIENCE:}
    jwk-set-uri: ${MANAGED_PAYMENTS_SECURITY_JWK_SET_URI:}
  delegation:
    mode: ${MANAGED_PAYMENTS_DELEGATION_MODE:unconfigured}
  peers:
    ledger:
      base-url: ${MANAGED_PAYMENTS_PEERS_LEDGER_BASE_URL:}
      audience: ${MANAGED_PAYMENTS_PEERS_LEDGER_AUDIENCE:}
  allow-loopback-http: ${MANAGED_PAYMENTS_ALLOW_LOOPBACK_HTTP:false}
  claim-lease-seconds: ${MANAGED_PAYMENTS_CLAIM_LEASE_SECONDS:30}

payment:
  sample:
    base-url: "https://sample.url"
    api-key: "my-secret-token"
    timeout: 3000

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    io.fireflysoftware: DEBUG
    org.springframework.r2dbc: DEBUG
    org.flywaydb: DEBUG

---
spring:
  config:
    activate:
      on-profile: testing

logging:
  level:
    root: INFO
    io.fireflysoftware: DEBUG
    org.springframework.r2dbc: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    io.fireflysoftware: INFO
    org.springframework: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
