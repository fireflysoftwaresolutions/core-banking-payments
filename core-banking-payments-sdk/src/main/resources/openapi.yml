        instructionPriority:
          type: string
          enum:
          - NORMAL
          - HIGH
          - URGENT
        instructionNotes:
          maxLength: 500
          minLength: 0
          type: string
        retryCount:
          maximum: 10
          minimum: 0
          type: integer
          format: int32
        lastRetryDate:
          type: string
          format: date-time
        errorCode:
          maxLength: 20
          minLength: 0
          type: string
        errorDescription:
          maxLength: 500
          minLength: 0
          type: string
    PaymentFeeDTO:
      required:
      - feeAmount
      - feeCurrencyCode
      - feeTypeEnum
      - feeWaived
      - paymentOrderId
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        paymentFeeId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        feeType:
          maxLength: 50
          minLength: 0
          type: string
        feeTypeEnum:
          type: string
          enum:
          - TRANSACTION_FEE
          - PROCESSING_FEE
          - CURRENCY_CONVERSION_FEE
          - INTERNATIONAL_TRANSFER_FEE
          - URGENT_PROCESSING_FEE
          - CORRESPONDENT_BANK_FEE
        feeAmount:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
        feeCurrencyCode:
          minLength: 1
          pattern: "^[A-Z]{3}$"
          type: string
        feeDescription:
          maxLength: 255
          minLength: 0
          type: string
        feeCalculationMethod:
          maxLength: 100
          minLength: 0
