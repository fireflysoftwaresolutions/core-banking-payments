      - paymentOrderId
      - rate
      - rateDate
      - rateProvider
      - rateType
      - sourceCurrency
      - targetCurrency
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        paymentExchangeRateId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        sourceCurrency:
