        "400":
          description: Invalid or unsupported managed payment input
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "401":
          description: A trusted current bearer token is required
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "403":
          description: Current action or exact account authority denied
          content:
            '*/*':
              schema:
