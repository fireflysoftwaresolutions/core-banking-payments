components:
  schemas:
    PaymentScheduleDTO:
      required:
      - amount
      - frequency
      - paymentOrderId
      - scheduleStatus
      - scheduledDate
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        paymentScheduleId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        scheduledDate:
          type: string
          format: date-time
        amount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        frequency:
          type: string
          enum:
          - ONE_TIME
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
        scheduleStatus:
          type: string
          enum:
          - SCHEDULED
          - COMPLETED
          - CANCELLED
        endDate:
          type: string
          format: date
        maxExecutions:
          maximum: 9999
          minimum: 1
          type: integer
          format: int32
        currentExecutionCount:
          minimum: 0
          type: integer
          format: int32
        nextExecutionDate:
          type: string
          format: date
        dayOfMonth:
          maximum: 31
          minimum: 1
          type: integer
          format: int32
        dayOfWeek:
          maximum: 7
          minimum: 1
          type: integer
          format: int32
        weekOfMonth:
          maximum: 5
          minimum: 1
          type: integer
          format: int32
        monthOfYear:
          maximum: 12
          minimum: 1
          type: integer
          format: int32
        scheduleNotes:
          maxLength: 500
          minLength: 0
          type: string
    PaymentProviderDTO:
      required:
      - paymentOrderId
      - providerName
      - providerType
      - status
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        paymentProviderId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        providerName:
          maxLength: 255
          minLength: 0
          type: string
        externalReference:
          maxLength: 100
          minLength: 0
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING
          - SUSPENDED
        providerType:
          maxLength: 50
          minLength: 0
          type: string
        providerUrl:
          maxLength: 500
          minLength: 0
          pattern: ^https?://.*
          type: string
        providerApiKey:
          maxLength: 255
          minLength: 0
          type: string
        providerUsername:
          maxLength: 100
          minLength: 0
          type: string
        providerAccountId:
          maxLength: 100
          minLength: 0
          type: string
        providerFee:
          minimum: 0.00
          exclusiveMinimum: false
          type: number
        providerFeeCurrencyCode:
          pattern: "^[A-Z]{3}$"
          type: string
        providerResponseCode:
          maxLength: 20
          minLength: 0
          type: string
        providerResponseMessage:
          maxLength: 500
          minLength: 0
          type: string
        providerTransactionId:
          maxLength: 100
          minLength: 0
          type: string
    PaymentProofDTO:
      required:
      - documentId
      - paymentOrderId
      - proofDate
      - proofType
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        paymentProofId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        proofType:
          maxLength: 50
          minLength: 0
          type: string
        proofDate:
          type: string
          format: date-time
    PayrollOrderDTO:
      required:
      - paymentOrderId
      - payrollDate
      - payrollReference
      - payrollStatus
      - totalAmount
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        payrollOrderId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        payrollReference:
          maxLength: 100
          minLength: 0
          type: string
        payrollDate:
          type: string
          format: date-time
        totalAmount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        payrollStatus:
          type: string
          enum:
          - INITIATED
          - PROCESSED
          - FAILED
    PaymentInstructionDTO:
      required:
      - instructionDate
      - instructionId
      - instructionStatus
      - instructionType
      - paymentOrderId
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        paymentInstructionId:
          type: string
          format: uuid
          readOnly: true
        paymentOrderId:
          type: string
          format: uuid
        instructionId:
          maxLength: 50
          minLength: 0
          type: string
        instructionType:
          type: string
          enum:
          - IMMEDIATE
          - SCHEDULED
        instructionDate:
          type: string
          format: date-time
        instructionStatus:
          type: string
          enum:
          - INITIATED
          - COMPLETED
          - FAILED
